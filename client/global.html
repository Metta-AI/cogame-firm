<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Firm — Table View</title>
<link rel="stylesheet" href="/client/chrome.css">
</head>
<body>
<div id="layout">
  <div id="stage">
    <div id="topband">
      <div id="wordmark">THE<span>FIRM</span></div>
      <div id="clock">SHIFT 0</div>
      <div id="topright">
        <span id="statuschip">connecting…</span>
        <button id="feedtoggle">LOG »</button>
      </div>
    </div>
    <div id="scorebug"></div>
    <!-- FIRM additions to the inherited cogame-bullwhip chrome: one element,
         the order-board readout, between the scorebug and the board. -->
    <div id="demandbar"></div>
    <div id="board-wrap">
      <canvas id="table" width="960" height="640"></canvas>
      <div id="lightpool"></div>
      <div id="grain"></div>
      <div id="endscreen"></div>
    </div>
    </div>
  <div id="feed"></div>
</div>
<script src="/client/renderer.js"></script>
<script>
  var canvas = document.getElementById("table");
  function fit() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
  }
  // FIRM: --band / --hudscale live on :root and the canvas re-fits from the
  // same function, so the two can never disagree.
  function relayout() {
    var root = document.documentElement;
    var transport = document.getElementById("transport");
    root.style.setProperty("--band",
      (transport ? transport.offsetHeight : 0) + "px");
    root.style.setProperty("--hudscale",
      String(Math.max(0.8, Math.min(window.innerWidth / 960, 1.15))));
    fit();
  }
  window.addEventListener("resize", relayout);
  window.addEventListener("load", relayout);
  relayout();
  FirmRenderer.bindFeedToggle(document.getElementById("feedtoggle"));
  FirmRenderer.attachLive({
    canvas: canvas,
    feed: document.getElementById("feed"),
    status: document.getElementById("statuschip"),
    clock: document.getElementById("clock"),
    scorebug: document.getElementById("scorebug"),
    demandbar: document.getElementById("demandbar"),
    endscreen: document.getElementById("endscreen"),
    assetBase: "/client/assets",
    wsPath: "/global"
  });
</script>
</body>
</html>
